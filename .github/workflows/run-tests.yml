name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, gd
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --coverage --min=95

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, intl, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests against postgres
        env:
          # TESTING_DB_DRIVER is what moves the suite off sqlite; the location vars alone
          # only say where the engine is. Tickets needs a real engine for its jsonb locale
          # maps and meta, the uuid/ulid key legs (sqlite's type affinity stores anything
          # anywhere), the self-referencing merge FK and the row locks of the sequences.
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg. Parallel
        # workers each get their own database (testing-for-laravel's DriverMatrix).
        run: vendor/bin/pest --ci --parallel

  test-mysql:
    runs-on: ubuntu-latest
    name: P8.4 - mysql real-engine

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, intl, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests against mysql
        env:
          # InnoDB's 3072-byte index limit and 64-character identifier limit (the morph
          # indexes), json instead of jsonb, and REPEATABLE READ under the sequence locks.
          TESTING_DB_DRIVER: mysql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 3306
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: root
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg. Parallel
        # workers each get their own database — InnoDB DDL makes the per-test schema reset
        # the slowest part of the suite.
        run: vendor/bin/pest --ci --parallel
